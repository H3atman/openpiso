[workspace]
members = [
  "apps/admin/src-tauri",
  "apps/client/src-tauri",
  "apps/client-guard",
  "crates/openpiso-core",
]
resolver = "2"

[profile.dev]
debug = 1

[workspace.package]
edition = "2021"
version = "0.12.4"
license = "PolyForm-Shield-1.0.0"
authors = ["OpenPiso Contributors"]

[workspace.dependencies]
argon2 = { version = "0.5", features = ["std"] }
# bcrypt is transitional: used only for verifying legacy credentials at login.
# OpenPiso never creates new bcrypt hashes. Remove once all accounts are Argon2.
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["multipart"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rand = "0.9"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }
tauri = { version = "2" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
uuid = { version = "1", features = ["v4", "serde"] }
mac_address = "1.1"
get_if_addrs = "0.5"
