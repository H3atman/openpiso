name: Bug report
description: Report a reproducible problem (not a security vulnerability).
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Security issues: use private vulnerability reporting, not this form. Remove secrets and customer records from logs."
  - type: input
    id: version
    attributes:
      label: Version and platform
      placeholder: OpenPiso version, Windows version, Admin or Client
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected behavior, and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
