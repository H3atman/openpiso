# Linux validation plus an unsigned Windows installer build and smoke test; signing secrets stay in the tag-triggered release workflow.
name: PR Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      # Tauri v2 Linux prerequisites, plus libudev (serialport), D-Bus, and Xvfb
      # for the Client real-command tests, which need a display.
      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file libxdo-dev libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libudev-dev libdbus-1-dev xvfb

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Same single command as local development (docs/development.md).
      # Windows-only Guard adapters still need separate Windows verification.
      - name: Verify
        run: xvfb-run --auto-servernum bun run verify

  # Builds both NSIS installers natively (updater artifacts off, so no signing key)
  # and smoke-tests them on the runner; see docs/development.md.
  windows-installers:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build unsigned Admin and Client installers
        run: bun run build:installers

      - name: Smoke-test installers on this runner
        shell: pwsh
        run: ./scripts/windows/installer-smoke.ps1 -InstallerDir dist/installers -OutDir smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installers
          path: |
            dist/installers/**/*-setup.exe
            smoke-out/
          retention-days: 7
          if-no-files-found: warn
